<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Committee Portal</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="top-nav">
        <a href="dashboard.html" class="nav-brand">
            <div class="emblem">CS</div>
            <span>Transfer Committee Portal</span>
        </a>
        <div class="user-menu">
            <div class="user-info">
                <div class="user-name" id="nav-user-name">Loading...</div>
                <div class="user-role-badge" id="nav-user-role">Committee Member</div>
            </div>
            <button onclick="handleLogout()" class="btn btn-outline btn-sm" style="color: white; border-color: rgba(255,255,255,0.3);">Logout</button>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-heading">Committee Menu</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="requests.html">📑 Pending Reviews Queue</a></li>
                <li><a href="notifications.html" class="active">🔔 Notifications</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Committee Member Notifications</h1>
                    <p class="page-subtitle">Forwarded application alerts and decision audit logs</p>
                </div>
                <button onclick="markAllRead()" class="btn btn-outline btn-sm">Mark All as Read</button>
            </div>

            <div id="c-notif-container" style="display: flex; flex-direction: column; gap: 1rem;">
                <p style="color: #64748b;">Loading notifications...</p>
            </div>
        </main>
    </div>

    <script src="../js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await initSession(['TRANSFER_COMMITTEE_MEMBER']);
            if (!user) return;
            loadNotifications();
        });

        async function loadNotifications() {
            try {
                const res = await fetch(API_BASE + 'notification');
                const data = await res.json();
                const container = document.getElementById('c-notif-container');

                if (data.status === 'success' && data.notifications.length > 0) {
                    container.innerHTML = '';
                    data.notifications.forEach(n => {
                        const isUnread = n.read_status === 'UNREAD';
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.style.borderLeft = isUnread ? '4px solid #2563eb' : '1px solid #e2e8f0';

                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div>
                                    <h4 style="color: #0f172a; margin-bottom: 0.25rem; font-size: 1rem;">${n.title} ${isUnread ? '<span class="badge badge-submitted">NEW</span>' : ''}</h4>
                                    <p style="color: #475569; font-size: 0.9rem; margin-bottom: 0.5rem;">${n.message}</p>
                                    <div style="font-size: 0.78rem; color: #94a3b8;">${n.created_at}</div>
                                </div>
                                ${isUnread ? `<button onclick="markRead(${n.notification_id})" class="btn btn-outline btn-sm">Mark Read</button>` : ''}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="color: #64748b;">No committee notifications found.</p>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function markRead(id) {
            try {
                await fetch(API_BASE + 'notification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=mark_read&notification_id=${id}`
                });
                loadNotifications();
            } catch (err) {
                console.error(err);
            }
        }

        async function markAllRead() {
            try {
                await fetch(API_BASE + 'notification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'action=mark_all_read'
                });
                loadNotifications();
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
